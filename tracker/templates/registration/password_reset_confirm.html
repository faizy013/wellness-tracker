{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Reset Your Password</title>
  <link rel="stylesheet" href="{% static 'tracker/login.css' %}">
</head>
<body>
  <div class="background">
    <div class="login-container">
      <h2>Reset Your Password</h2>
      <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Change Password</button>
      </form>
    </div>
  </div>
</body>
</html>
