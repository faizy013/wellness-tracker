{% extends "tracker/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'tracker/add_water_log.css' %}">

<div class="form-container">
  <h2 class="form-title">💧 Log Water Intake</h2>
  <form method="POST" class="form-box">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-primary">💾 Save Exercise Log</button>
  </form>
  <a href="{% url 'dashboard' %}" class="btn-secondary">← Back to Dashboard</a>
</div>
{% endblock %}
