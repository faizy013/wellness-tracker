{% extends 'tracker/base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto p-6 bg-white shadow-lg rounded-2xl mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Add Sleep Log</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="mb-4 px-4 py-2 rounded-md text-sm 
                {% if message.tags == 'success' %}
                    bg-green-100 text-green-800
                {% elif message.tags == 'error' %}
                    bg-red-100 text-red-800
                {% else %}
                    bg-gray-100 text-gray-800
                {% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" class="space-y-5">
        {% csrf_token %}

        <div>
            <label for="start_time" class="block mb-1 font-semibold text-gray-700">Start Time</label>
            <input type="datetime-local" name="start_time" id="start_time"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
                required>
        </div>

        <div>
            <label for="end_time" class="block mb-1 font-semibold text-gray-700">End Time</label>
            <input type="datetime-local" name="end_time" id="end_time"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
                required>
        </div>

        <div>
            <label for="notes" class="block mb-1 font-semibold text-gray-700">Notes (optional)</label>
            <textarea name="notes" id="notes" rows="3"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
                placeholder="e.g. Slept late, woke up early, dreams, etc."></textarea>
        </div>

        <div class="text-center">
            <button type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2 rounded-lg shadow-sm transition duration-200">
                Save Sleep Log
            </button>
        </div>
    </form>
</div>
{% endblock %}
