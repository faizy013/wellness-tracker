{% extends 'tracker/base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto p-6 bg-white shadow-lg rounded-2xl mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Add Mood Log</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="mb-4 px-4 py-2 rounded-md text-sm 
                {% if message.tags == 'success' %}
                    bg-green-100 text-green-800
                {% elif message.tags == 'error' %}
                    bg-red-100 text-red-800
                {% else %}
                    bg-gray-100 text-gray-800
                {% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" class="space-y-5">
        {% csrf_token %}

        <div>
            <label for="mood" class="block mb-1 font-semibold text-gray-700">Mood</label>
            <select name="mood" id="mood"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
                required>
                <option value="" disabled selected>Select your mood</option>
                <option value="Happy">😊 Happy</option>
                <option value="Sad">😢 Sad</option>
                <option value="Angry">😠 Angry</option>
                <option value="Anxious">😰 Anxious</option>
                <option value="Excited">😄 Excited</option>
                <option value="Neutral">😐 Neutral</option>
            </select>
        </div>

        <div>
            <label for="intensity" class="block mb-1 font-semibold text-gray-700">Mood Intensity</label>
            <input type="range" name="intensity" id="intensity" min="1" max="10"
                class="w-full cursor-pointer accent-purple-500">
            <div class="text-sm text-gray-500 text-right">1 = Low, 10 = Intense</div>
        </div>

        <div>
            <label for="date" class="block mb-1 font-semibold text-gray-700">Date</label>
            <input type="date" name="date" id="date"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
                required>
        </div>

        <div>
            <label for="notes" class="block mb-1 font-semibold text-gray-700">Notes (optional)</label>
            <textarea name="notes" id="notes" rows="3"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
                placeholder="Why are you feeling this way? Talk it out 👇"></textarea>
        </div>

        <div class="text-center">
            <button type="submit"
                class="bg-purple-600 hover:bg-purple-700 text-white font-semibold px-6 py-2 rounded-lg shadow-sm transition duration-200">
                Save Mood Log
            </button>
        </div>
    </form>
</div>
{% endblock %}
